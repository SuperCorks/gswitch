name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'SuperCorks/gswitch'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          package_version="v$(node --print "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Inject production OAuth client
        run: npm run release:inject-oauth-client
        env:
          GSWITCH_OAUTH_CLIENT_JSON: ${{ secrets.GSWITCH_OAUTH_CLIENT_JSON }}

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > package-contents.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const [pack] = JSON.parse(fs.readFileSync('package-contents.json', 'utf8'));
          const files = new Set(pack.files.map(file => file.path));
          const required = 'src/config/google-oauth-client.json';

          if (!files.has(required)) {
            throw new Error(`${required} is missing from the npm package`);
          }
          NODE

      - name: Publish to npm
        run: npm publish
